name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Sandbox check
        run: |
          node plugins/jb-memory/scripts/jbm.js --sandbox-check
          node plugins/jb-memory-codex/scripts/jbm.js --sandbox-check
      - name: Checks added in 0.4.5 (both copies)
        shell: bash
        run: |
          node --test --test-reporter=tap plugins/jb-memory/tests/handoff-checks.test.js plugins/jb-memory-codex/tests/handoff-checks.test.js > tap-new.txt 2>&1 && ok=1 || ok=0
          node .github/tap-annotate.js tap-new.txt
          [ "$ok" = 1 ]
      # The full suites predate Windows CI: about 20 of their tests plant
      # shell-script stand-ins for git or expect backslash paths, so on
      # Windows they run and report without failing the job until they are
      # ported (CHANGELOG, 0.4.5). The PowerShell suites in tools/windows
      # cover Windows.
      - name: jb-memory tests
        if: always()
        continue-on-error: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          node --test --test-reporter=tap plugins/jb-memory/tests/jb-memory.test.js > tap-claude.txt 2>&1 && ok=1 || ok=0
          node .github/tap-annotate.js tap-claude.txt
          [ "$ok" = 1 ]
      - name: jb-memory-codex tests
        if: always()
        continue-on-error: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          node --test --test-reporter=tap plugins/jb-memory-codex/tests/jb-memory.test.js > tap-codex.txt 2>&1 && ok=1 || ok=0
          node .github/tap-annotate.js tap-codex.txt
          [ "$ok" = 1 ]
