name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          # Runner images can hold an older Node than the security floor.
          check-latest: true
      # Once per run: the checksums match, install.sh parses, and the files the
      # two plugin copies share word for word haven't drifted apart.
      - name: Repository checks
        if: runner.os == 'Linux' && matrix.node == '24'
        shell: bash
        run: |
          sha256sum --quiet -c SHA256SUMS
          bash -n install.sh
          node --check tools/migrate-from-jb-memory.js
          node tools/migrate-from-jb-memory.js --help > /dev/null
          for f in LICENSE scripts/hook-milestone.js scripts/hook-precompact.js scripts/lib/commands.js scripts/lib/gitbin.js scripts/lib/gitfacts.js scripts/lib/health.js scripts/lib/hookio.js scripts/lib/plainfile.js tests/handoff-checks.test.js; do
            cmp plugins/trailmark/$f plugins/trailmark-codex/$f || { echo "::error file=plugins/trailmark-codex/$f::differs from plugins/trailmark/$f"; bad=1; }
          done
          [ -z "$bad" ]
      - name: Sandbox check
        shell: bash
        run: |
          for c in trailmark trailmark-codex; do
            out=$(node plugins/$c/scripts/trailmark.js --sandbox-check) || { echo "$out"; exit 1; }
            echo "$out"
            if grep -q 'WARN' <<<"$out"; then echo "::error::$c sandbox check warned on $(node --version)"; exit 1; fi
          done
      - name: PowerShell scripts parse (Windows PowerShell 5.1 and PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Join-Path $env:RUNNER_TEMP 'parse-check.ps1'
          Set-Content -LiteralPath $p -Value @'
          param([string]$File)
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($File, [ref]$tokens, [ref]$errors)
          foreach ($e in $errors) { Write-Output ('::error file={0},line={1}::{2}' -f $File, $e.Extent.StartLineNumber, $e.Message) }
          if ($errors) { exit 1 }
          '@
          $files = @(Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object FullName)
          $bad = 0
          foreach ($f in $files) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $p $f; if ($LASTEXITCODE) { $bad++ }
            & pwsh -NoProfile -File $p $f; if ($LASTEXITCODE) { $bad++ }
          }
          Write-Output "parsed $($files.Count) files with both shells, $bad failures"
          if ($bad) { exit 1 }
      # The watchdog's own test (Windows PowerShell 5.1, a throwaway copy of the
      # release). It needs a desktop for its two notification checks, so it
      # reports here without failing the job; its FAIL lines become annotations.
      - name: Watchdog test (reports only)
        if: runner.os == 'Windows' && matrix.node == '24'
        continue-on-error: true
        shell: pwsh
        run: |
          $out = & "$env:windir\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/windows/test-trailmark-watchdog.ps1 2>&1 | ForEach-Object { [string]$_ }
          $fails = @($out | Where-Object { $_ -match '^\s+FAIL\s' })
          $result = @($out | Where-Object { $_ -match '^Result: ' }) | Select-Object -Last 1
          Write-Output "::notice title=watchdog test::$result"
          if ($fails.Count) { Write-Output ("::warning title=watchdog test failures ($($fails.Count))::" + (($fails | ForEach-Object { $_.Trim() }) -join '%0A')) }
          if (-not $result -or $fails.Count) { exit 1 }
      - name: Checks added in 0.4.5 (both copies)
        shell: bash
        run: |
          node --test --test-reporter=tap plugins/trailmark/tests/handoff-checks.test.js plugins/trailmark-codex/tests/handoff-checks.test.js > tap-new.txt 2>&1 && ok=1 || ok=0
          node .github/tap-annotate.js tap-new.txt
          [ "$ok" = 1 ]
      # A few tests need a shell script in place of git; they say so and
      # skip themselves on Windows, where trailmark runs git.exe only.
      - name: trailmark tests
        if: always()
        shell: bash
        run: |
          node --test --test-reporter=tap plugins/trailmark/tests/trailmark.test.js > tap-claude.txt 2>&1 && ok=1 || ok=0
          node .github/tap-annotate.js tap-claude.txt
          [ "$ok" = 1 ]
      - name: trailmark-codex tests
        if: always()
        shell: bash
        run: |
          node --test --test-reporter=tap plugins/trailmark-codex/tests/trailmark.test.js > tap-codex.txt 2>&1 && ok=1 || ok=0
          node .github/tap-annotate.js tap-codex.txt
          [ "$ok" = 1 ]
